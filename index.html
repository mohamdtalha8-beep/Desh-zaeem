<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الزعيم TV</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #2b0b3a 0%, #0a0a1a 50%, #000000 100%);
    --card-bg: #1a1a2e;
    --card-hover: #2a2a4e;
    --accent: #f0bd4a;
    --text: #ffffff;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg-gradient); color: var(--text); height: 100vh; overflow: hidden; direction: rtl; }
  
  /* الشريط العلوي */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .header h1 { color: var(--accent); font-size: 24px; font-weight: 900; }
  .time { font-size: 18px; font-weight: 600; color: #ccc; }

  /* منطقة المحتوى */
  #main-view { padding: 20px 40px; height: calc(100vh - 80px); overflow-y: auto; scroll-behavior: smooth; }
  #main-view::-webkit-scrollbar { width: 0; }

  .row { margin-bottom: 30px; }
  .row h2 { font-size: 20px; margin-bottom: 15px; font-weight: 800; color: #e2e2e2; }
  
  .cards-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scroll-behavior: smooth; }
  .cards-container::-webkit-scrollbar { height: 0; }

  /* البطاقات */
  .card {
    flex: 0 0 auto; width: 180px; height: 110px; background: var(--card-bg);
    border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s ease-in-out; border: 2px solid transparent;
    text-align: center; padding: 10px;
  }
  .card:hover, .card:focus {
    transform: scale(1.08); border-color: var(--accent); background: var(--card-hover);
    box-shadow: 0 10px 20px rgba(240, 189, 74, 0.2); outline: none; z-index: 10;
  }
  .card img { max-width: 80%; height: 45px; object-fit: contain; margin-bottom: 10px; border-radius: 4px; }
  .card span { font-size: 14px; font-weight: 700; color: #fff; }

  /* المشغل */
  #player { position: fixed; inset: 0; z-index: 100; display: none; background: #000; }
  #player.open { display: block; }
  #videoPlayer, #ytFrame { width: 100%; height: 100%; object-fit: contain; border: none; }
  #closeBtn { position: absolute; top: 20px; right: 20px; z-index: 101; padding: 10px 20px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #555; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
  #closeBtn:focus { background: var(--accent); color: #000; border-color: var(--accent); outline: none; }
  #hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: var(--accent); padding: 8px 20px; border-radius: 20px; font-weight: bold; display: none; z-index: 102; }

  @media (max-width: 800px) {
    .header { padding: 15px 20px; }
    #main-view { padding: 15px 20px; }
    .card { width: 140px; height: 100px; }
    .card img { height: 40px; }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>👑 الزعيم TV</h1>
    <div class="time" id="clock"></div>
  </div>

  <div id="main-view">
    <!-- سيتم بناء الصفوف هنا تلقائياً -->
  </div>

  <div id="player" tabindex="-1">
    <video id="videoPlayer" autoplay playsinline></video>
    <div id="hud"></div>
    <button id="closeBtn">✕ رجوع</button>
  </div>

<script>
  // 1. تحديث الساعة
  setInterval(() => {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  }, 1000);

  // 2. بيانات التطبيقات والقنوات (تم دمج يوتيوب و TizenTube داخل التطبيق)
  const homeData = [
    {
      title: 'التطبيقات المفضلة',
      items: [
        // تم تحويل يوتيوب ليعمل داخل الموقع كـ Web Player
        { name: 'YouTube', icon: 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
        { name: 'Netflix', icon: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg', url: 'https://www.netflix.com' },
        { name: 'Shahid VIP', icon: 'https://upload.wikimedia.org/wikipedia/ar/thumb/2/26/Shahid_VIP_Logo.png/200px-Shahid_VIP_Logo.png', url: 'https://shahid.mbc.net' },
        { name: 'Google Play', icon: 'https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg', url: 'https://play.google.com' }
      ]
    },
    {
      title: 'منصات البث والترفيه',
      items: [
        { name: 'Disney+', icon: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg', url: 'https://www.disneyplus.com' },
        { name: 'Prime Video', icon: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg', url: 'https://www.primevideo.com' },
        // TizenTube يعمل الآن كصفحة يوتيوب مدمجة بدون إعلانات (يمكنك تغيير رابط الفيديو)
        { name: 'TizenTube', icon: 'https://cdn-icons-png.flaticon.com/512/888/888839.png', url: 'https://www.youtube.com/embed/jNQXAC9IVRw' },
        { name: 'Zaeem IPTV', icon: 'https://cdn-icons-png.flaticon.com/512/2586/2586549.png', url: 'https://mohamdtalha8-beep.github.io/Zaeem/' }
      ]
    },
    {
      title: 'قنوات مباشرة (تعمل داخل التطبيق)',
      items: [
        { name: 'MBC 1', icon: 'https://upload.wikimedia.org/wikipedia/en/thumb/9/9f/MBC_1_Logo.png/200px-MBC_1_Logo.png', url: 'https://shls-live-enc.edgenextcdn.net/out/v1/9b31b5fb73ee47c39a14c8fa9c80d3b6/index.m3u8' },
        { name: 'الجزيرة', icon: 'https://upload.wikimedia.org/wikipedia/en/thumb/e/e0/Al_Jazeera_English_Logo.svg/200px-Al_Jazeera_English_Logo.svg.png', url: 'https://live-hls-web-aja.getaj.net/AJA/index.m3u8' },
        { name: 'العربية', icon: 'https://upload.wikimedia.org/wikipedia/ar/thumb/6/6c/Al_Arabiya_logo.png/200px-Al_Arabiya_logo.png', url: 'https://live.alarabiya.net/alarabiapublish/alarabiya.smil/playlist.m3u8' }
      ]
    }
  ];

  const viewEl = document.getElementById('main-view');
  const player = document.getElementById('player');
  const video = document.getElementById('videoPlayer');
  const closeBtn = document.getElementById('closeBtn');
  const hud = document.getElementById('hud');
  let currentCards = [];
  let focusIndex = 0;
  let hls = null;
  let ytIframe = null; // متغير جديد لمشغل يوتيوب

  // 3. رسم الواجهة
  function renderHome() {
    viewEl.innerHTML = '';
    homeData.forEach(row => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row';
      
      const title = document.createElement('h2');
      title.textContent = row.title;
      rowDiv.appendChild(title);

      const container = document.createElement('div');
      container.className = 'cards-container';
      
      row.items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;
        
        card.onclick = () => {
          if (item.url && (item.url.includes('.m3u8') || item.url.includes('youtube.com/embed'))) {
            playVideo(item.url, item.name);
          } else if (item.url && item.url !== '#') {
             window.open(item.url, '_blank');
          }
        };
        
        card.innerHTML = `<img src="${item.icon}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'50\\' height=\\'50\\'><rect width=\\'50\\' height=\\'50\\' fill=\\'%23333\\'/><text x=\\'25\\' y=\\'30\\' font-size=\\'12\\' text-anchor=\\'middle\\' fill=\\'%23fff\\'>TV</text></svg>'"> <span>${item.name}</span>`;
        
        currentCards.push(card);
        container.appendChild(card);
      });

      rowDiv.appendChild(container);
      viewEl.appendChild(rowDiv);
    });
    
    if(currentCards.length > 0) currentCards[0].focus();
  }

  // 4. دالة التشغيل المطورة (تدعم HLS و يوتيوب)
  function playVideo(url, name) {
    player.classList.add('open');
    player.focus();
    hud.style.display = 'block';
    hud.textContent = 'جاري التحميل: ' + name;

    // إذا كان الرابط يوتيوب مدمج
    if (url.includes('youtube.com/embed')) {
      video.style.display = 'none';
      video.pause();
      if (hls) { hls.destroy(); hls = null; }

      if (!ytIframe) {
        ytIframe = document.createElement('iframe');
        ytIframe.id = 'ytFrame';
        ytIframe.allow = 'autoplay; encrypted-media; fullscreen';
        ytIframe.allowFullscreen = true;
        player.appendChild(ytIframe);
      }
      ytIframe.style.display = 'block';
      ytIframe.src = url + '?autoplay=1&rel=0';
      hud.style.display = 'none';
      return;
    }

    // إذا كان بث مباشر (HLS)
    video.style.display = 'block';
    if (ytIframe) {
      ytIframe.style.display = 'none';
      ytIframe.src = 'about:blank';
    }

    if (window.Hls && Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        hud.style.display = 'none';
        video.play().catch(e => console.log(e));
      });
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          hud.textContent = '⚠️ القناة لا تعمل حالياً';
          setTimeout(() => hud.style.display = 'none', 3000);
        }
      });
    } else {
      video.src = url;
      video.play().catch(e => console.log(e));
      hud.style.display = 'none';
    }
  }

  // 5. إغلاق المشغل
  function closePlayer() {
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
    
    if (ytIframe) {
      ytIframe.src = 'about:blank';
    }
    
    player.classList.remove('open');
    if(currentCards[focusIndex]) currentCards[focusIndex].focus();
  }
  closeBtn.onclick = closePlayer;

  // 6. التحكم بالريموت
  document.addEventListener('keydown', (e) => {
    if (player.classList.contains('open')) {
      if (e.key === 'Escape' || e.keyCode === 10009 || e.keyCode === 461 || e.key === 'Backspace') {
        closePlayer();
      }
      return;
    }

    if (e.key === 'ArrowRight') {
      e.preventDefault();
      moveFocus(1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      moveFocus(-1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (document.activeElement.classList.contains('card')) {
        document.activeElement.click();
      }
    }
  });

  function moveFocus(dir) {
    const current = document.activeElement;
    const idx = currentCards.indexOf(current);
    if (idx === -1) return;
    
    let nextIdx = idx + dir;
    if (nextIdx >= 0 && nextIdx < currentCards.length) {
      currentCards[nextIdx].focus();
      currentCards[nextIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      focusIndex = nextIdx;
    }
  }

  // بدء التطبيق
  renderHome();
</script>
</body>
</html>
