<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الزعيم TV</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #2b0b3a 0%, #0a0a1a 50%, #000000 100%);
    --card-bg: #1a1a2e;
    --card-hover: #2a2a4e;
    --accent: #f0bd4a;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg-gradient); color: var(--text); height: 100vh; overflow: hidden; direction: rtl; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .header h1 { color: var(--accent); font-size: 24px; font-weight: 900; }
  .time { font-size: 18px; font-weight: 600; color: #ccc; }
  #main-view { padding: 20px 40px; height: calc(100vh - 80px); overflow-y: auto; }
  #main-view::-webkit-scrollbar { width: 0; }
  .row { margin-bottom: 30px; }
  .row h2 { font-size: 20px; margin-bottom: 15px; font-weight: 800; color: #e2e2e2; }
  .cards-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
  .cards-container::-webkit-scrollbar { height: 0; }
  .card { flex: 0 0 auto; width: 180px; height: 110px; background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; border: 2px solid transparent; padding: 10px; }
  .card:hover, .card:focus { transform: scale(1.08); border-color: var(--accent); background: var(--card-hover); outline: none; }
  .card img { max-width: 60px; height: 45px; object-fit: contain; margin-bottom: 10px; }
  .card span { font-size: 14px; font-weight: 700; color: #fff; text-align: center; }
  @media (max-width: 800px) { .header { padding: 15px 20px; } #main-view { padding: 15px 20px; } }
</style>
</head>
<body>

  <div class="header">
    <h1>👑 الزعيم TV</h1>
    <div class="time" id="clock"></div>
  </div>

  <div id="main-view">
    <!-- الصف الأول: متجر جوجل -->
    <div class="row">
      <h2>متجر التطبيقات</h2>
      <div class="cards-container">
        <div class="card" tabindex="0" onclick="window.location.href='market://details?id=com.android.vending'">
          <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg">
          <span>Google Play</span>
        </div>
        <div class="card" tabindex="0" onclick="window.location.href='market://details?id=com.google.android.youtube.tv'">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
          <span>YouTube</span>
        </div>
        <div class="card" tabindex="0" onclick="window.location.href='market://details?id=com.netflix.ninja'">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
          <span>Netflix</span>
        </div>
      </div>
    </div>

    <!-- الصف الثاني: التطبيقات المثبتة (تظهر تلقائياً إذا استخدمت Fully Kiosk) -->
    <div class="row">
      <h2>تطبيقاتي المثبتة</h2>
      <div class="cards-container" id="installed-apps">
        <div class="card" style="width: 100%; justify-content: center; color: #aaa;">
           <span>سيتم عرض تطبيقاتك هنا تلقائياً (يتطلب تطبيق Fully Kiosk)</span>
        </div>
      </div>
    </div>
  </div>

<script>
  // تحديث الساعة
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  }, 1000);

  // دالة ذكية: إذا كان الموقع مفتوحاً داخل Fully Kiosk، سيقوم بجلب التطبيقات تلقائياً
  function loadInstalledApps() {
    if (typeof fully !== 'undefined') {
      // طلب قائمة التطبيقات من نظام الأندرويد
      fully.getInstalledApps(function(apps) {
        const container = document.getElementById('installed-apps');
        container.innerHTML = ''; // مسح الرسالة
        
        apps.forEach(app => {
          if(app.packageName === 'com.android.vending') return; // تجاهل المتجر نفسه

          const card = document.createElement('div');
          card.className = 'card';
          card.tabIndex = 0;
          
          // عند الضغط، يقوم بفتح التطبيق (الواتساب، إلخ)
          card.onclick = () => { fully.startApplication(app.packageName, ''); };
          
          card.innerHTML = `<img src="${app.iconUrl}" onerror="this.style.display='none'"> <span>${app.label}</span>`;
          container.appendChild(card);
        });
      });
    }
  }

  // تشغيل الدالة بعد تحميل الصفحة
  window.addEventListener('load', loadInstalledApps);

  // التنقل بالريموت
  let cards = [];
  document.addEventListener('keydown', (e) => {
    cards = Array.from(document.querySelectorAll('.card')).filter(c => c.offsetParent !== null);
    const idx = cards.indexOf(document.activeElement);
    
    if (e.key === 'ArrowRight' && idx < cards.length - 1) { e.preventDefault(); cards[idx + 1].focus(); }
    else if (e.key === 'ArrowLeft' && idx > 0) { e.preventDefault(); cards[idx - 1].focus(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (document.activeElement.classList.contains('card')) document.activeElement.click(); }
  });
</script>
</body>
</html>
